<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sin conexión — GFA</title>
    <!-- Sin dependencias externas: esta página se muestra justamente cuando no hay red. -->
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #0a0a0a;
        color: #f2f0eb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 28px 0 8px; font-size: 1.75rem; letter-spacing: -0.03em; }
      p { margin: 0; color: #8a8a85; line-height: 1.5; }
      p + p { margin-top: 4px; font-size: 0.9rem; }
      button {
        margin-top: 28px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: #c6ff3d;
        color: #0a0a0a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="GFA" />
      <h1>Sin conexión</h1>
      <p>Revisa tu conexión a internet y vuelve a intentarlo.</p>
      <p lang="en">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
